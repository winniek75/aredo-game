<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Are / Do クイズゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --are: #e63946;
    --do: #3a86ff;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #2b2d42;
    --correct: #06d6a0;
    --wrong: #ef233c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 16px 40px;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(230,57,70,.07) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(58,134,255,.07) 0%, transparent 45%);
  }

  /* ─── Header ─────────────────────────────────── */
  .header { text-align: center; margin-bottom: 6px; }
  h1 { font-family:'Nunito',sans-serif; font-size:clamp(1.4rem,4vw,2rem); color:var(--text); }
  h1 span.are{color:var(--are);} h1 span.do{color:var(--do);}

  .legend {
    display:flex; gap:18px; justify-content:center; margin: 8px 0 0;
    font-size:.82rem; color:#666; flex-wrap:wrap;
  }
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-badge{
    padding:3px 10px; border-radius:5px;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:.8rem; color:white;
  }
  .legend-badge.are{background:var(--are);}
  .legend-badge.do{background:var(--do);}

  /* ─── Settings row ───────────────────────────── */
  .settings-row {
    display:flex; align-items:center; gap:10px; margin: 14px 0 10px;
    font-size:.83rem; color:#888; font-weight:700; flex-wrap:wrap; justify-content:center;
  }
  .settings-row select {
    padding:5px 12px; border-radius:99px; border:2px solid #dde;
    font-family:'Noto Sans JP',sans-serif; font-size:.83rem; font-weight:700;
    color:var(--text); background:white; cursor:pointer; outline:none;
  }
  .settings-row select:focus{border-color:var(--do);}

  .export-btn {
    padding:5px 14px; border-radius:99px; border:2px solid #dde;
    font-family:'Noto Sans JP',sans-serif; font-size:.83rem; font-weight:700;
    color:var(--text); background:white; cursor:pointer; transition:all .15s;
  }
  .export-btn:hover{background:var(--text);color:white;border-color:var(--text);}

  /* ─── Progress ───────────────────────────────── */
  .progress-wrap{width:min(560px,100%);height:6px;background:#dde;border-radius:99px;margin-bottom:12px;overflow:hidden;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--are),var(--do));border-radius:99px;transition:width .4s ease;}

  .score-row{
    display:flex;gap:16px;margin-bottom:14px;
    font-size:.85rem;font-weight:700;color:#999;
    align-items:center;
  }
  .score-row span{display:flex;align-items:center;gap:4px;}
  .score-row .num{font-size:1.1rem;color:var(--text);}

  /* ─── Card ───────────────────────────────────── */
  .card {
    background:var(--card); border-radius:22px;
    width:min(560px,100%);
    box-shadow:0 6px 32px rgba(0,0,0,.09);
    position:relative; overflow:hidden;
  }
  .card.shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .card.pop{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}

  /* ─── Photo area ─────────────────────────────── */
  .photo-area {
    width:100%; height:200px;
    background: linear-gradient(135deg,#f0f2f8,#e8ecf4);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-radius:22px 22px 0 0;
    position:relative;
  }
  .photo-area img {
    width:100%; height:100%; object-fit:cover;
    display:none;
    border-radius:22px 22px 0 0;
  }
  .photo-area img.loaded { display:block; }
  .photo-area .no-photo {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    color:#bcc; font-size:.8rem; font-weight:700; letter-spacing:.5px;
  }
  .photo-area .no-photo .icon { font-size:2.5rem; opacity:.4; }
  .photo-area .q-badge {
    position:absolute; top:10px; left:12px;
    background:rgba(255,255,255,.85); backdrop-filter:blur(4px);
    border-radius:99px; padding:3px 12px;
    font-size:.75rem; font-weight:700; color:var(--text); letter-spacing:.5px;
  }

  /* ─── Card body ──────────────────────────────── */
  .card-body { padding:24px 28px 22px; }

  .question-jp {
    font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900;
    color:var(--text); margin-bottom:6px; line-height:1.2;
  }
  .question-rest {
    font-size:clamp(.95rem,3vw,1.25rem); color:#aab;
    margin-bottom:22px; font-weight:400;
  }
  .question-rest code {
    font-family:'Nunito',sans-serif; font-weight:700; color:#ccd; font-size:1.1em;
  }

  /* ─── Buttons ────────────────────────────────── */
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:11px; margin-bottom:10px;}
  .btn {
    padding:15px 8px; border:none; border-radius:13px; cursor:pointer;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:1.45rem; color:white;
    transition:transform .12s,box-shadow .12s;
    box-shadow:0 4px 14px rgba(0,0,0,.13);
    line-height:1;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18);}
  .btn:disabled{opacity:.45;cursor:default;transform:none;}
  .btn-are{background:var(--are);} .btn-are:hover{background:#d62839;}
  .btn-do{background:var(--do);}   .btn-do:hover{background:#2971e6;}
  .btn .sub{display:block;font-size:.58rem;font-family:'Noto Sans JP',sans-serif;font-weight:700;opacity:.85;margin-top:3px;letter-spacing:0;}
  .btn.correct-flash{animation:correctFlash .5s ease forwards;}
  @keyframes correctFlash{0%{box-shadow:0 0 0 0 var(--correct);}50%{box-shadow:0 0 0 10px rgba(6,214,160,.3);transform:scale(1.05);}100%{box-shadow:0 4px 14px rgba(0,0,0,.13);transform:scale(1);}}

  /* ─── Nav row (back button) ──────────────────── */
  .nav-row{
    display:flex; justify-content:flex-start;
    width:min(560px,100%); margin-bottom:8px;
  }
  .back-btn{
    display:flex; align-items:center; gap:5px;
    background:white; border:2px solid #dde; border-radius:99px;
    padding:6px 16px; cursor:pointer; font-size:.82rem; font-weight:700;
    color:#99a; font-family:'Noto Sans JP',sans-serif;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    transition:all .15s;
  }
  .back-btn:hover{border-color:#aab;color:var(--text);box-shadow:0 4px 12px rgba(0,0,0,.1);}
  .back-btn:disabled{opacity:.25;cursor:default;}

  /* ─── Feedback overlay ───────────────────────── */
  .feedback{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; border-radius:22px;
    opacity:0; pointer-events:none; transition:opacity .2s;
    padding:20px;
  }
  .feedback.show{opacity:1;pointer-events:all;}
  .feedback.correct{background:rgba(6,214,160,.18);}
  .feedback.wrong{background:rgba(239,35,60,.12);}
  .feedback .fb-icon{font-size:3.5rem;margin-bottom:8px;}
  .feedback .fb-text{font-size:1.1rem;font-weight:900;color:var(--text);}
  .feedback .fb-answer{
    margin-top:8px;font-size:.88rem;color:#555;text-align:center;
    line-height:1.7; background:rgba(255,255,255,.7);
    padding:8px 16px; border-radius:10px; max-width:340px;
  }
  .feedback .fb-ans-en { font-family:'Nunito',sans-serif; font-weight:700; font-size:1rem; color:var(--text); }
  .feedback .fb-hint { font-size:.8rem; color:#777; }
  .feedback .fb-btn{
    margin-top:16px; padding:11px 30px; border-radius:99px; border:none;
    background:var(--text); color:white; font-family:'Nunito',sans-serif;
    font-weight:700; font-size:.95rem; cursor:pointer; transition:transform .1s;
  }
  .feedback .fb-btn:hover{transform:scale(1.05);}

  /* ─── Result screen ──────────────────────────── */
  #result{
    display:none; flex-direction:column; align-items:center; text-align:center;
    gap:14px; padding:44px 30px; background:white; border-radius:22px;
    box-shadow:0 6px 32px rgba(0,0,0,.09); width:min(560px,100%);
    animation:fadeIn .4s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #result h2{font-family:'Nunito',sans-serif;font-size:1.8rem;color:var(--text);}
  .big-score{
    font-family:'Nunito',sans-serif;font-size:5.5rem;font-weight:900;line-height:1;
    background:linear-gradient(135deg,var(--are),var(--do));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  #result .rank{font-size:1.05rem;color:#888;}
  .restart-btn{
    padding:14px 40px; border-radius:99px; border:none;
    background:linear-gradient(135deg,var(--are),var(--do)); color:white;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:1.1rem;
    cursor:pointer; transition:transform .15s;
    box-shadow:0 4px 16px rgba(58,134,255,.3);
  }
  .restart-btn:hover{transform:scale(1.05);}
</style>
</head>
<body>

<div class="header">
  <h1><span class="are">Are</span> vs <span class="do">Do</span> クイズ 🎯</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-badge are">Are</div>どんな状態？</div>
    <div class="legend-item"><div class="legend-badge do">Do</div>何をする？</div>
  </div>
</div>

<div class="settings-row">
  出題数：
  <select id="numSelect">
    <option value="10">10問</option>
    <option value="20" selected>20問</option>
    <option value="30">30問</option>
    <option value="50">50問</option>
    <option value="100">全100問</option>
  </select>
  <button class="export-btn" style="display:none" onclick="exportCSV()">📥 問題一覧をExcel出力</button>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

<div class="score-row">
  <span>✅ <span class="num" id="scoreCorrect">0</span></span>
  <span>❌ <span class="num" id="scoreWrong">0</span></span>
  <span>📝 <span class="num" id="scoreCurrent">1</span> / <span id="scoreTotal">20</span></span>
</div>

<div class="nav-row">
  <button class="back-btn" id="backBtn" onclick="goBack()" disabled>← 前の問題</button>
</div>
<div class="card" id="card">
  <!-- Photo area -->
  <div class="photo-area" id="photoArea">
    <div class="q-badge" id="qBadge">Q 1 / 20</div>
    <img id="qPhoto" alt="question image" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
    <div class="no-photo" id="noPhoto">
      <div class="icon">🖼️</div>
      <div>images / q<span id="noPhotoNum">001</span>.jpg</div>
    </div>
  </div>

  <!-- Card body -->
  <div class="card-body">
    <div class="question-jp" id="qJp"></div>
    <div class="question-rest" id="qRest"></div>
    <div class="btn-row">
      <button class="btn btn-are" id="btnAre" onclick="answer('Are')">
        Are<span class="sub">どんな状態？</span>
      </button>
      <button class="btn btn-do" id="btnDo" onclick="answer('Do')">
        Do<span class="sub">何をする？</span>
      </button>
    </div>
  </div>

  <!-- Feedback overlay -->
  <div class="feedback" id="feedback">
    <div class="fb-icon" id="fbIcon">✅</div>
    <div class="fb-text" id="fbText">正解！</div>
    <div class="fb-answer">
      <div class="fb-ans-en" id="fbAnsEn"></div>
      <div class="fb-hint" id="fbHint"></div>
    </div>
    <button class="fb-btn" onclick="nextQuestion()">次の問題 →</button>
  </div>
</div>

<!-- Result screen -->
<div id="result">
  <div style="font-size:3rem" id="resultEmoji">🎉</div>
  <h2>結果発表！</h2>
  <div class="big-score" id="resultScore">20 / 20</div>
  <div class="rank" id="resultRank">完璧！マスター級！</div>
  <button class="restart-btn" onclick="restart()">もう一度チャレンジ 🔄</button>
</div>

// ─────────────────────────────────────────────────────────────
// Game state
// ─────────────────────────────────────────────────────────────
let shuffled = [];
let idx = 0;
let correct = 0;
let wrong = 0;
let history = []; // {idx, answered, wasCorrect}

function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function pad(n){ return String(n).padStart(3,'0'); }

function loadQuestion(){
  const q = shuffled[idx];
  const total = shuffled.length;
  const qNum = `Q ${idx+1} / ${total}`;

  document.getElementById('qBadge').textContent = qNum;
  document.getElementById('noPhotoNum').textContent = pad(parseInt(q.no));

  // Photo
  const img = document.getElementById('qPhoto');
  const noPhoto = document.getElementById('noPhoto');
  img.classList.remove('loaded');
  img.style.display = '';
  noPhoto.style.display = 'flex';
  img.src = 'images/' + q.img;
  img.onload = () => { img.classList.add('loaded'); noPhoto.style.display = 'none'; };
  img.onerror = () => { img.style.display = 'none'; noPhoto.style.display = 'flex'; };

  document.getElementById('qJp').textContent = q.jp;
  document.getElementById('qRest').innerHTML = `<code>___</code> ${q.rest}`;
  document.getElementById('scoreCurrent').textContent = idx+1;
  document.getElementById('progressBar').style.width = `${(idx/total)*100}%`;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btnAre').disabled = false;
  document.getElementById('btnDo').disabled = false;
  document.getElementById('backBtn').disabled = (idx === 0);

  // Animate card in
  const card = document.getElementById('card');
  card.style.opacity = 0;
  card.style.transform = 'translateY(10px)';
  setTimeout(()=>{
    card.style.transition = 'opacity .25s,transform .25s';
    card.style.opacity = 1;
    card.style.transform = 'none';
  }, 20);
}

function answer(choice){
  const q = shuffled[idx];
  const isCorrect = choice === q.ans;
  const card = document.getElementById('card');
  const fb = document.getElementById('feedback');

  document.getElementById('btnAre').disabled = true;
  document.getElementById('btnDo').disabled = true;

  history[idx] = { answered: choice, wasCorrect: isCorrect };

  if(isCorrect){
    correct++;
    document.getElementById('scoreCorrect').textContent = correct;
    document.getElementById('fbIcon').textContent = '✅';
    document.getElementById('fbText').textContent = '正解！ すごい！';
    document.getElementById('fbAnsEn').textContent = `${q.ans} ${q.rest}`;
    document.getElementById('fbHint').textContent = q.hint;
    fb.className = 'feedback correct show';
    card.classList.add('pop'); setTimeout(()=>card.classList.remove('pop'),300);
    document.getElementById(choice==='Are'?'btnAre':'btnDo').classList.add('correct-flash');
  } else {
    wrong++;
    document.getElementById('scoreWrong').textContent = wrong;
    document.getElementById('fbIcon').textContent = '❌';
    document.getElementById('fbText').textContent = `不正解… 答えは「${q.ans}」！`;
    document.getElementById('fbAnsEn').textContent = `${q.ans} ${q.rest}`;
    document.getElementById('fbHint').textContent = q.hint;
    fb.className = 'feedback wrong show';
    card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'),400);
  }
}

function nextQuestion(){
  idx++;
  if(idx >= shuffled.length){ showResult(); } else { loadQuestion(); }
}

function goBack(){
  if(idx === 0) return;
  // Undo score of current idx (if already answered)
  if(history[idx]){
    if(history[idx].wasCorrect){ correct--; document.getElementById('scoreCorrect').textContent=correct; }
    else { wrong--; document.getElementById('scoreWrong').textContent=wrong; }
    history[idx] = null;
  }
  // Undo score of prev idx (if already answered, we're revisiting)
  if(history[idx-1]){
    if(history[idx-1].wasCorrect){ correct--; document.getElementById('scoreCorrect').textContent=correct; }
    else { wrong--; document.getElementById('scoreWrong').textContent=wrong; }
    history[idx-1] = null;
  }
  idx--;
  loadQuestion();
}

function showResult(){
  document.getElementById('card').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  const r = document.getElementById('result');
  r.style.display = 'flex';
  const pct = correct / shuffled.length;
  let rank, emoji;
  if(pct===1)      {rank='完璧！ マスター級 🏆';          emoji='🎉';}
  else if(pct>=.9) {rank='優秀！ もう少しで満点！';        emoji='😄';}
  else if(pct>=.7) {rank='なかなか！ もう一息！';          emoji='😊';}
  else if(pct>=.5) {rank='もう一息！ 練習を続けよう！';    emoji='💪';}
  else             {rank='頑張れ！ 何度でも挑戦しよう！';  emoji='📚';}
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = `${correct} / ${shuffled.length}`;
  document.getElementById('resultRank').textContent = rank;
}

function restart(){
  correct=0; wrong=0; idx=0; history=[];
  document.getElementById('scoreCorrect').textContent=0;
  document.getElementById('scoreWrong').textContent=0;
  document.getElementById('result').style.display='none';
  document.getElementById('card').style.display='block';
  const num = parseInt(document.getElementById('numSelect').value);
  shuffled = shuffle(ALL_QUESTIONS).slice(0, Math.min(num, ALL_QUESTIONS.length));
  document.getElementById('scoreTotal').textContent = shuffled.length;
  loadQuestion();
}

// ─────────────────────────────────────────────────────────────
// CSV export（Excelで開ける）
// ─────────────────────────────────────────────────────────────
function exportCSV(){
  const BOM = '\uFEFF'; // Excel用BOM
  const header = ['No','日本語','英語（残り部分）','答え（Are/Do）','完全な英語文','ヒント','画像ファイル名'];
  const rows = ALL_QUESTIONS.map(q => [
    q.no,
    q.jp,
    q.rest,
    q.ans,
    `${q.ans} ${q.rest}`,
    q.hint,
    q.img
  ]);
  const csv = BOM + [header, ...rows]
    .map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(','))
    .join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'are_do_questions.csv';
  a.click(); URL.revokeObjectURL(url);
}

  loadQuestion();
